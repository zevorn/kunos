# K230 CanMV: Canaan Kendryte K230 RISC-V dual-core SoC
# Little-core Linux only (big-core RT-Smart not managed here)

# tune-riscv.inc is in poky/meta/conf/machine/include/riscv/ — NOT in meta-riscv.
# bitbake finds it via BBPATH layer search (poky/meta is always in the path).
require conf/machine/include/riscv/tune-riscv.inc

DEFAULTTUNE = "riscv64"

PREFERRED_PROVIDER_virtual/kernel ?= "linux-k230"

SERIAL_CONSOLES = "115200;ttyS0"

KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = "canaan/k230-canmv.dtb"

IMAGE_FSTYPES = "cpio.gz"

MACHINE_FEATURES = ""

# Each BSP recipe uses COMPATIBLE_MACHINE = "k230-canmv" individually.
# Do NOT set COMPATIBLE_MACHINE here — it would block all native tools.

